<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kahu</title>
      <meta name="description" content="Discover your cat's breed with Kahu">
      <link rel="stylesheet" href="css/bootstrap.min.css">
      <link rel="stylesheet" href="css/style.css">
      <link rel="stylesheet" href="css/responsive.css">
      <link rel="stylesheet" href="css/results.css">
      <link rel="stylesheet" href="css/joey-chat.css">
      <link rel="stylesheet" href="css/memory-game.css">
      <link rel="stylesheet" href="css/n-queens.css">
      <link rel="stylesheet" href="css/coquette-pages.css">
      <link rel="stylesheet" href="css/home-coquette.css">
      <link rel="icon" href="images/logo.png" type="image/png">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css">
      <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
      <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css" media="screen">
   </head>
   <body class="main-layout">
      <div class="loader_bg" id="loader_bg">
         <div class="loader"><img src="images/loading.gif" alt="Loading"></div>
      </div>

      <div id="app"></div>

      <div id="joey-chat" class="joey-chat joey-chat--hidden" aria-hidden="true">
         <div class="joey-chat__header">
            <img src="images/logo.png" alt="" class="joey-chat__avatar">
            <span class="joey-chat__title">Hey its Joe!</span>
            <button type="button" class="joey-chat__close" id="joey-chat-close" aria-label="Close chat">&times;</button>
         </div>
         <div class="joey-chat__messages" id="joey-messages">
            <div class="joey-chat__bubble joey-chat__bubble--bot">
               Hi! I'm Joe 👋 Ask me anything about cats, cat care, or veterinary health. I'm here to help.
            </div>
         </div>
         <form class="joey-chat__input-row" id="joey-form">
            <input type="text" id="joey-input" placeholder="Ask about cats, breeds, or vet care..." autocomplete="off">
            <button type="submit" id="joey-send">Send</button>
         </form>
      </div>

      <script src="js/jquery.min.js"></script>
      <script src="js/popper.min.js"></script>
      <script src="js/bootstrap.bundle.min.js"></script>
      <script src="js/jquery-3.0.0.min.js"></script>
      <script src="js/plugin.js"></script>
      <script src="js/jquery.mCustomScrollbar.concat.min.js"></script>
      <script src="js/custom.js"></script>
      <script src="js/memory-game.js"></script>
      <script src="js/n-queens.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.js"></script>
      <script type="module" src="js/app.js"></script>
   </body>
</html>
